<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الخبير</title>
    <link rel="stylesheet" href="css/style.css"> </head>
<body class="dashboard-page">

    <div class="dashboard-wrapper">
        
        <aside class="sidebar">
            <div class="logo">لوحة الخبير</div>
            <nav>
                <ul>
                    <div id="expertJoinSection" style="margin: 20px; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
    <h3>هل ترغب في الانضمام كخبير معتمد؟</h3>
    <p>قدم طلباً للإدارة وسنقوم بمراجعة مؤهلاتك.</p>
    <button id="requestJoinBtn" onclick="submitExpertRequest()" style="background: #2b6cb0; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
        إرسال طلب انضمام
    </button>
</div>
                    <li><a href="#" onclick="showSection('dashboard')">الرئيسية</a></li>
                    <li><a href="#" onclick="showSection('my-requests')">الطلبات الواردة</a></li>
                    <li><a href="#" onclick="showSection('sessions')">جلساتي القادمة</a></li>
                    <button id="logoutBtn" class="logout-btn">تسجيل الخروج</button>
                </ul>
            </nav>
        </aside>

        <main class="content">
            <header>
    <h1>مرحباً بك يا خبيرنا، <span id="expertName">...</span></h1>
</header>

            <section id="dashboard" class="content-section">
                <h2>نظرة عامة</h2>
                <div class="card">الطلبات الجديدة: 5</div>
            </section>

            <section id="my-requests" class="content-section" style="display:none;">
                <h2>الطلبات الواردة</h2>
                <p>قائمة الطلبات ستظهر هنا...</p>
            </section>
        </main>

    </div>

    <script src="js/script.js"></script>
    <script>
        // تأكد من تشغيل الحماية
        protectPage(['expert', 'admin']);
    </script>
</body>
</html>
